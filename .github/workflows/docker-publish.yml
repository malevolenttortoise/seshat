name: Build and Push Docker Image

on:
  push:
    # `main` builds the stable `:latest-slim` (default-branch flag in
    # the metadata-action below restricts the `latest` tag to it).
    # `development` is the permanent staging branch; pushes here build
    # `:development-slim` via the `type=ref,event=branch` rule. The
    # container in Mark's Unraid points at the `development` tag so
    # UAT happens in-place; only after a `development -> main` PR is
    # merged + tagged does `latest-slim` (and the versioned tag) move.
    branches: [main, development]
    tags: ['v*']
  workflow_dispatch:

# Serialize by REF, not by SHA.
#
# A release fires three pushes at the same commit in quick
# succession — the merge to `main`, the `vX.Y.Z` tag, and the
# `development` fast-forward. Keying the group on `github.sha` put
# all three in ONE group, and a group holds at most one running +
# one pending run: the third arrival evicts whichever was queued.
# So the tag build was cancelled on every release from v3.8.1
# through v3.9.0, and `:vX.Y.Z-slim` was never actually published
# (each had to be re-run by hand to exist at all).
#
# Keying on `github.ref` gives main / the tag / development their
# own groups, so all three publish. It still serializes what the
# original grouping was there for: two rapid pushes to the SAME
# ref queue behind each other rather than racing for the GHCR
# push. Their metadata-action invocations emit different image
# tags per ref, so parallel runs across refs don't collide.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Two image variants per commit:
    #   - full:  ghcr.io/<repo>:latest         (Calibre bundled, ~860MB)
    #   - slim:  ghcr.io/<repo>:latest-slim    (no Calibre,      ~225MB)
    # Suffix + onlatest makes metadata-action emit `latest-slim` /
    # `<version>-slim` for the slim row alongside the bare tags for full.
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ""
          - dockerfile: Dockerfile.slim
            suffix: "-slim"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          # `type=semver` requires strict SemVer 2.0.0 (three numeric
          # segments) and emits no tag when the ref doesn't match —
          # which silently broke the tag-push build on v2.3.4.1/2/3/4
          # (four segments by our loose-SemVer-within-an-arc policy;
          # see feedback_seshat_semver_policy.md). Switching to
          # `type=match` lets us extract the version verbatim,
          # supporting both 3-segment (v2.3.5) and 4-segment
          # (v2.3.4.4) tags. The two patterns emit `<full>` and
          # `<major>.<minor>` so you still get `2.3.4.4` AND `2.3`
          # tags pointing at the same image.
          tags: |
            type=ref,event=branch
            type=match,pattern=v(\d+\.\d+\.\d+(?:\.\d+)?),group=1
            type=match,pattern=v(\d+\.\d+),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the commit SHA into /app/VERSION so the Settings
          # page can show "Build: <short-sha>" and users can verify
          # they're running the version they think they are.
          build-args: |
            GIT_SHA=${{ github.sha }}
