name: Tests

# Until now nothing in CI ran pytest — the only workflow here builds and
# publishes images. That is why two tests in
# `tests/discovery/test_trigger_lookup.py` could break in 25c2855
# (ADR-0021 slice 3) and survive both the v3.10.0 and v3.10.1 releases
# unnoticed. This workflow is the gate that would have caught them.
#
# Since Phase 0 S3 (2026-10-06) the suite GATES as well as reports:
#   - Pushes to `main` / `development` run it through docker-publish.yml,
#     which calls this workflow (`workflow_call`) and builds no image from
#     a red commit. There is no `push` trigger here any more — it would
#     run the same suite twice per push.
#   - PRs into `main` run it here; branch protection on `main` requires
#     `pytest (py3.12)` and `pytest (py3.13)` to pass before a merge.
on:
  pull_request:
    branches: [main, development]
  workflow_call:
  workflow_dispatch:

# Tags are deliberately NOT a trigger: a `vX.Y.Z` tag points at a commit
# already tested by its push to `main`, so running the suite again buys
# nothing and just burns a slot during the three-push release sequence.
#
# Cancel only superseded PR runs. When docker-publish.yml calls this, a
# cancelled test run would skip that commit's image build — the same
# "an image that was never published" failure its concurrency comment
# warns about — so called (`push`) and dispatched runs are never
# cancelled. Keying on event + ref keeps main / development / each PR in
# independent groups.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite is ~2.5 min locally now that its two slowest tests no
    # longer sleep for real (`test_negative_jitter_does_not_underflow`
    # was ~147s, `test_resolver_never_hits_goodreads_search` ~92s of
    # rate-limit sleeps plus real goodreads.com requests). 30 min leaves
    # generous headroom on a slower hosted runner without hanging a
    # stuck run for the full 6-hour default.
    timeout-minutes: 30

    strategy:
      # Don't let one version's failure cancel the other — knowing
      # whether a break is version-specific is the whole point of the
      # matrix.
      fail-fast: false
      matrix:
        # 3.12 is what SHIPS (`python:3.12-slim` in both Dockerfiles),
        # so it is the version that actually gates a release. 3.13 is
        # what the dev venv runs (~/.cache/seshat-venv), so testing it
        # too stops "passes locally, red in CI" (and the reverse) from
        # being a mystery.
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt already `-r requirements.txt`, but naming
        # both is explicit and survives that line being dropped.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        # No `-q`: on a failure the CI log is the only artifact, so the
        # short traceback and the `-ra` summary are what make a red run
        # diagnosable without re-running locally.
        run: pytest tests/ --tb=short -ra --durations=10
